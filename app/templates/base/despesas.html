{% extends 'base/layout.html' %}
{% block head %}<title>Despesas</title>{% endblock %}
{% block content %}
<header class="sticky top-0 z-10 border-b border-primary/10 bg-background-light/90 backdrop-blur dark:bg-background-dark/90 lg:top-14">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 p-4"><div><h1 class="text-xl font-extrabold text-secondary dark:text-white">Despesas</h1><p class="text-sm text-slate-500">{{ g.current_organization.name }}</p></div><div class="flex flex-wrap justify-end gap-2"><a href="{{ url_for('main.historico_despesas') }}" class="inline-flex min-h-12 items-center rounded-xl border border-secondary px-4 font-bold text-secondary">Histórico de preços</a>{% if g.current_organization_membership.role == 'admin' %}<a href="{{ url_for('main.nova_despesa') }}" class="inline-flex min-h-12 items-center rounded-xl bg-primary px-5 font-extrabold text-secondary">+ Nova despesa</a>{% endif %}</div></div>
</header>
<main class="mx-auto max-w-7xl space-y-5 p-4 md:p-6 lg:p-8">
  <form id="filtros-despesas" class="grid grid-cols-1 gap-3 rounded-xl border border-primary/10 bg-white p-4 shadow-sm sm:grid-cols-2 lg:grid-cols-5"><label class="text-sm font-bold">Data inicial<input name="data_inicial" type="date" class="mt-1 min-h-11 w-full rounded-xl border-slate-200"></label><label class="text-sm font-bold">Data final<input name="data_final" type="date" class="mt-1 min-h-11 w-full rounded-xl border-slate-200"></label><label class="text-sm font-bold">Categoria<select name="categoria" class="mt-1 min-h-11 w-full rounded-xl border-slate-200"><option value="">Todas</option>{% for item in ['ingredientes','bebidas','embalagens','limpeza','transporte','equipamentos','outros'] %}<option value="{{ item }}">{{ item|capitalize }}</option>{% endfor %}</select></label><label class="text-sm font-bold">Fornecedor<input name="fornecedor" class="mt-1 min-h-11 w-full rounded-xl border-slate-200"></label><label class="text-sm font-bold">Status<select name="status" class="mt-1 min-h-11 w-full rounded-xl border-slate-200"><option value="">Todos</option><option value="pendente">Pendente</option><option value="pago">Pago</option><option value="cancelado">Cancelado</option></select></label></form>
  <p id="despesas-erro" class="hidden rounded-xl bg-red-50 p-4 text-sm font-semibold text-red-700" role="alert"></p>
  <section id="lista-despesas" class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3" aria-live="polite"></section>
</main>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/base/despesas.js') }}"></script>{% endblock %}
