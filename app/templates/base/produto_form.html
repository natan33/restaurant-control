<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="https://cdn.tailwindcss.com?plugins=forms"></script><title>{{ 'Editar produto' if produto else 'Novo produto' }}</title></head>
<body class="min-h-screen bg-slate-50 text-slate-800"><main class="mx-auto max-w-lg p-4 sm:p-8"><h1 class="mb-6 text-2xl font-bold">{{ 'Editar produto' if produto else 'Novo produto' }}</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p class="mb-3 rounded-lg bg-red-50 p-3 text-red-700">{{ message }}</p>{% endfor %}{% endwith %}<form method="post" class="space-y-4 rounded-xl border bg-white p-5 shadow-sm"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="block font-semibold">Nome<input required name="nome" value="{{ produto.nome if produto else '' }}" class="mt-1 min-h-12 w-full rounded-lg border-slate-200"></label><label class="block font-semibold">Preço<input required name="preco" type="number" min="0.01" step="0.01" value="{{ produto.preco if produto else '' }}" class="mt-1 min-h-12 w-full rounded-lg border-slate-200"></label><label class="flex items-center gap-2"><input name="ativo" type="checkbox" {% if not produto or produto.ativo %}checked{% endif %}> Ativo</label><div class="flex gap-2"><button class="rounded-lg bg-primary px-4 py-3 font-bold text-white">Salvar</button><a href="{{ url_for('main.produtos') }}" class="rounded-lg border px-4 py-3">Cancelar</a></div></form></main></body></html>
