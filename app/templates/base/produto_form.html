<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>tailwind.config={darkMode:"class",theme:{extend:{colors:{primary:"#f6a50e",secondary:"#2c3e50","background-light":"#f8f7f5","background-dark":"#221c10"},fontFamily:{display:["Manrope"]}}}};</script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}body{font-family:'Manrope',sans-serif}</style>
    <title>{{ 'Editar produto' if produto else 'Novo produto' }}</title>
</head>
<body class="min-h-screen bg-background-light pb-24 font-display text-slate-900 dark:bg-background-dark dark:text-slate-100 lg:pt-14">
    <header class="sticky top-0 z-10 border-b border-primary/10 bg-background-light/90 backdrop-blur dark:bg-background-dark/90"><div class="mx-auto max-w-7xl p-4"><h1 class="text-xl font-extrabold text-secondary dark:text-white">{{ 'Editar produto' if produto else 'Novo produto' }}</h1><p class="text-sm text-slate-500">{{ g.current_organization.name }}</p></div></header>
    <main class="mx-auto max-w-2xl p-4 md:p-6 lg:p-8"><form method="post" class="space-y-5 rounded-xl border border-primary/10 bg-white p-5 shadow-sm dark:bg-slate-800"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p role="alert" class="rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ message }}</p>{% endfor %}{% endwith %}<label class="block font-bold text-secondary dark:text-white">Nome<input required name="nome" value="{{ produto.nome if produto else '' }}" class="mt-1 min-h-12 w-full rounded-xl border-slate-200"></label><label class="block font-bold text-secondary dark:text-white">Preço<input required name="preco" type="number" min="0.01" step="0.01" value="{{ produto.preco if produto else '' }}" class="mt-1 min-h-12 w-full rounded-xl border-slate-200"></label><label class="flex min-h-12 items-center gap-2 font-bold text-secondary dark:text-white"><input name="ativo" type="checkbox" {% if not produto or produto.ativo %}checked{% endif %}> Ativo</label><div class="flex flex-col gap-2 sm:flex-row"><button class="min-h-12 rounded-xl bg-primary px-5 font-extrabold text-secondary">Salvar produto</button><a href="{{ url_for('main.produtos') }}" class="inline-flex min-h-12 items-center justify-center rounded-xl border border-slate-200 px-5 font-bold">Cancelar</a></div></form></main>
    {% include 'base/navbar.html' %}
</body>
</html>
