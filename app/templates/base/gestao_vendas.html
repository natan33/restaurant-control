<!DOCTYPE html>

<html class="light" lang="pt-br" data-theme="{{ (g.organization_settings|default({})).get('theme_key', 'default') }}">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link href="{{ url_for('static', filename='css/theme.css') }}" rel="stylesheet" />
    <title>{{ g.organization_settings.app_display_name|default(g.current_organization.name) }} - Gestão de Vendas</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f6a50e",
                        "secondary": "#2c3e50",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221c10",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
    <!-- Header Section -->
    <header
        class="sticky top-0 z-20 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-primary/10">
        <div class="flex items-center p-4 justify-between">
            <div id="retorno"
                class="text-secondary dark:text-primary flex size-10 shrink-0 items-center justify-center rounded-lg bg-primary/10">
                <span class="material-symbols-outlined">arrow_back</span>
            </div>
            <h2
                class="text-secondary dark:text-slate-100 text-xl font-extrabold leading-tight tracking-tight flex-1 px-4">
                Gestão de Vendas</h2>

        </div>
        <!-- Search Bar -->
        <div class="px-4 pb-4">
            <label class="flex flex-col w-full h-12">
                <div class="flex w-full flex-1 items-stretch rounded-xl h-full shadow-sm">
                    <div
                        class="text-primary flex bg-white dark:bg-slate-800 items-center justify-center pl-4 rounded-l-xl border-y border-l border-primary/20">
                        <span class="material-symbols-outlined">search</span>
                    </div>
                    <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary border-y border-r border-primary/20 bg-white dark:bg-slate-800 h-full placeholder:text-slate-400 px-4 rounded-l-none pl-2 text-base font-normal"
                        placeholder="Pesquisar vendas, clientes..." value="" />
                </div>
            </label>
        </div>
        <!-- Filters Horizontal Scroll -->
        <div class="flex gap-2 px-4 pb-4 overflow-x-auto no-scrollbar">
            <button
                class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-primary/10 border border-primary/20 px-3 whitespace-nowrap">
                <span class="text-secondary dark:text-primary text-sm font-semibold">ID</span>
                <span class="material-symbols-outlined text-sm">expand_more</span>
            </button>
            <button
                class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-primary/10 border border-primary/20 px-3 whitespace-nowrap">
                <span class="text-secondary dark:text-primary text-sm font-semibold">Cliente</span>
                <span class="material-symbols-outlined text-sm">expand_more</span>
            </button>
            <button
                class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-primary/10 border border-primary/20 px-3 whitespace-nowrap">
                <span class="text-secondary dark:text-primary text-sm font-semibold">Vendedor</span>
                <span class="material-symbols-outlined text-sm">expand_more</span>
            </button>
            <button
                class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-primary/10 border border-primary/20 px-3 whitespace-nowrap">
                <span class="text-secondary dark:text-primary text-sm font-semibold">Data</span>
                <span class="material-symbols-outlined text-sm">expand_more</span>
            </button>

            <button
                class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-primary/10 border border-primary/20 px-3 whitespace-nowrap">
                <span class="text-secondary dark:text-primary text-sm font-semibold">Status Pagamento</span>
                <span class="material-symbols-outlined text-sm">expand_more</span>
            </button>

            <button
                class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-primary/10 border border-primary/20 px-3 whitespace-nowrap">
                <span class="text-secondary dark:text-primary text-sm font-semibold">Status Entrega</span>
                <span class="material-symbols-outlined text-sm">expand_more</span>
            </button>
        </div>
    </header>
    <main class="flex-1 overflow-y-auto">
        <!-- Summary Cards -->
        <div class="grid grid-cols-4 gap-3 p-4">

            <div
                class="flex flex-col gap-1 rounded-xl p-4 bg-white dark:bg-slate-800 border border-primary/10 shadow-sm">
                <p class="text-slate-500 dark:text-slate-400 text-xs font-bold uppercase tracking-wider">Total</p>
                <p id="total-vendas" class="text-secondary dark:text-primary text-2xl font-black">0</p>
            </div>

            <div
                class="flex flex-col gap-1 rounded-xl p-4 bg-white dark:bg-slate-800 border border-green-500/10 shadow-sm">
                <p class="text-green-600 dark:text-green-400 text-xs font-bold uppercase tracking-wider">Pagos</p>
                <p id="pagos-vendas" class="text-green-700 dark:text-green-300 text-2xl font-black">0</p>
            </div>

            <div
                class="flex flex-col gap-1 rounded-xl p-4 bg-white dark:bg-slate-800 border border-red-500/10 shadow-sm">
                <p class="text-red-600 dark:text-red-400 text-xs font-bold uppercase tracking-wider">Pendentes</p>
                <p id="pendentes-vendas" class="text-red-700 dark:text-red-300 text-2xl font-black">0</p>
            </div>

            <div
                class="flex flex-col gap-1 rounded-xl p-4 bg-white dark:bg-slate-800 border border-blue-500/10 shadow-sm">
                <p class="text-blue-600 dark:text-blue-400 text-xs font-bold uppercase tracking-wider">Entregues</p>
                <p id="entregues-vendas" class="text-blue-700 dark:text-blue-300 text-2xl font-black">0</p>
            </div>

        </div>
        <!-- Sales List Title -->
        <div class="px-4 py-2 flex justify-between items-center">
            <h3 class="text-secondary dark:text-slate-100 font-bold text-lg">Últimas Vendas</h3>
            <div class="flex gap-4 items-center">
                <span class="text-primary text-sm font-bold cursor-pointer" id="ver-tudo">Ver tudo</span>

                <span id="btn-exportar"
                    class="text-primary text-sm font-bold flex items-center gap-1 cursor-pointer hover:text-primary/80">
                    <span class="material-symbols-outlined text-base">table_chart</span>
                    Excel
                </span>
            </div>
        </div>
        <!-- Sales List -->
        <div id="vendas_lista" class="flex flex-col gap-3 px-4 pb-24">
            <!-- Sale Card 1 -->
        </div>
    </main>
    <!-- Floating Action Button -->
    <button
        class="fixed bottom-24 right-6 size-16 bg-primary text-secondary dark:text-background-dark rounded-full shadow-lg shadow-primary/40 flex items-center justify-center z-30 ring-4 ring-background-light dark:ring-background-dark">
        <a href="{{ url_for('main.nova_venda') }}"
            class="fixed bottom-24 right-6 size-16 bg-primary text-secondary rounded-full flex items-center justify-center shadow-lg">
            <span class="material-symbols-outlined text-3xl">add</span>
        </a>
    </button>
    <!-- Bottom Navigation Bar -->
    {% include 'base/navbar.html' %}

    <script src="{{ url_for('static', filename='js/base/gestao_vendas.js') }}"></script>

</body>

</html>
